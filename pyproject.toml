[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crns-beta"
version = "1.0.0"
description = "Barometric coefficient (beta) for CRNS and neutron monitors: empirical Method A and the Desilets & Zreda (2003) analytical model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Patrick Davies" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cartopy>=0.22",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
